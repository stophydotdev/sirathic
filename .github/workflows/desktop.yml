name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            app: dist/mac-arm64/Sirathic.app/Contents/MacOS/Sirathic
          - name: Windows
            os: windows-latest
            app: dist/win-unpacked/Sirathic.exe
          - name: Linux
            os: ubuntu-latest
            app: dist/linux-unpacked/sirathic
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools zstd
      - run: bun run build
      - name: Allow the Electron sandbox on Ubuntu
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} bun smoke.ts ${{ matrix.app }}
      - uses: actions/upload-artifact@v7
        with:
          name: sirathic-${{ matrix.name }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" installers/*
          --repo "$GITHUB_REPOSITORY"
          --title "Sirathic ${GITHUB_REF_NAME#desktop-v}"
          --generate-notes --latest
