name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            app: dist/mac-arm64/Sirathic.app/Contents/MacOS/Sirathic
          - name: Windows
            os: windows-latest
            app: dist/win-unpacked/Sirathic.exe
          - name: Linux
            os: ubuntu-latest
            app: dist/linux-unpacked/desktop
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Allow the Electron sandbox on Ubuntu
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke test
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} bun smoke.ts ${{ matrix.app }}
      - uses: actions/upload-artifact@v7
        with:
          name: sirathic-${{ matrix.name }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
          if-no-files-found: error
      - name: Upload installers to download.sirathic.com
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a92c2838c35f48660fb0fce75470e87e
        run: |
          for file in dist/Sirathic-*.dmg dist/Sirathic-*.exe dist/Sirathic-*.AppImage; do
            [ -e "$file" ] || continue
            bunx wrangler@4.151.1 r2 object put "sirathic-downloads/$(basename "$file")" \
              --file "$file" --remote \
              --content-type application/octet-stream \
              --cache-control "public, max-age=300"
          done
