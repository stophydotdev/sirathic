<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Sirathic</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: oklch(1 0 0);
        --muted-foreground: oklch(0.556 0 0);
        --primary: oklch(0.205 0 0);
        --primary-foreground: oklch(0.985 0 0);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #161616;
          --muted-foreground: rgb(222 222 222 / 65%);
          --primary: #dedede;
          --primary-foreground: #161616;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        background: var(--background);
        color: var(--muted-foreground);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
        user-select: none;
      }
      svg {
        width: 64px;
        height: 64px;
      }
      p {
        margin: 0;
      }
      a {
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--primary);
        color: var(--primary-foreground);
        font-weight: 500;
        text-decoration: none;
      }
      body:not(.offline) :is(p, a) {
        display: none;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 24 24">
      <clipPath id="c"><circle cx="12" cy="12" r="11.5" /></clipPath>
      <circle cx="12" cy="12" r="12" />
      <g transform="translate(2.4 2.4) scale(0.8)">
        <g clip-path="url(#c)" fill="none" stroke="#e6e6e6">
          <circle cx="18" cy="12" r="6" />
          <circle cx="18" cy="12" r="6" transform="rotate(45 12 12)" />
          <circle cx="18" cy="12" r="6" transform="rotate(90 12 12)" />
          <circle cx="18" cy="12" r="6" transform="rotate(135 12 12)" />
          <circle cx="18" cy="12" r="6" transform="rotate(180 12 12)" />
          <circle cx="18" cy="12" r="6" transform="rotate(225 12 12)" />
          <circle cx="18" cy="12" r="6" transform="rotate(270 12 12)" />
          <circle cx="18" cy="12" r="6" transform="rotate(315 12 12)" />
          <circle cx="12" cy="12" r="10.9" />
        </g>
      </g>
    </svg>
    <p>Sirathic could not be loaded. Try again later.</p>
    <a>Try again</a>
    <script>
      const retry = new URLSearchParams(location.search).get("retry");
      if (retry) {
        document.body.classList.add("offline");
        document.querySelector("a").href = retry;
      }
    </script>
  </body>
</html>
