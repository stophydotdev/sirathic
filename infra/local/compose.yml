name: sirathic-infra

services:
  cache:
    image: valkey/valkey@sha256:cfe71288f087704b06be45e270afa7a2abbf820093d6b11a23762081f5ff321d
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lfu"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  searxng:
    image: sirathic/searxng:local
    build:
      context: ../..
      dockerfile: infra/searxng/Dockerfile
    environment:
      # Local-only fallback. Production deployments must provide a secret.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-development-only-change-me}
      DECODO_PROXY_URL: ${DECODO_PROXY_URL:-}
    ports:
      - "18888:8080"
    restart: unless-stopped

  crawl4ai:
    image: sirathic/crawl4ai:local
    build:
      context: ../crawl4ai
    environment:
      DECODO_PROXY_URL: ${DECODO_PROXY_URL:-}
      DECODO_FETCH_PORTS: ${DECODO_FETCH_PORTS:-10001,10002,10003}
    ports:
      - "11235:11235"
    shm_size: 1gb
    restart: unless-stopped

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3@sha256:851ff5f9615ab7d2f00931114f6db32850f0208ec9fe7e841f135ac78f5f13d5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  elastic-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3@sha256:851ff5f9615ab7d2f00931114f6db32850f0208ec9fe7e841f135ac78f5f13d5
    depends_on:
      elastic:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: http://elastic:9200
    entrypoint: ["bash", "/opt/sirathic/elastic/init.sh"]
    volumes:
      - ../elastic:/opt/sirathic/elastic:ro
    restart: "no"

volumes:
  elastic-data:
