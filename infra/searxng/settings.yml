use_default_settings:
  engines:
    keep_only:
      - bing
      - startpage
      - mwmbl
      - yandex

general:
  instance_name: "sirathic-searxng"

search:
  formats:
    - json

outgoing:
  request_timeout: 1.0
  max_request_timeout: 1.2
  extra_proxy_timeout: 0
  pool_connections: 200
  pool_maxsize: 100
  keepalive_expiry: 30.0
  enable_http2: true

engines:
  - name: bing
    disabled: false
    timeout: 1.1
    retries: 0
    retry_on_http_error: [403, 429]
  - name: startpage
    disabled: false
    timeout: 1.1
    retries: 0
    retry_on_http_error: [403, 429]
  - name: mwmbl
    disabled: false
    timeout: 1.1
    retries: 0
  - name: yandex
    disabled: false
    timeout: 1.1
    retries: 0

server:
  bind_address: "0.0.0.0"
  port: 8080
  method: "GET"
  limiter: false
  public_instance: false
