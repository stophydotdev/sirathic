app:
  title: "Sirathic Crawl4AI"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 11235
  reload: false
  workers: 1
  timeout_keep_alive: 300

redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""
  task_ttl_seconds: 3600
  ssl: false

rate_limiting:
  enabled: false
  default_limit: "1000/minute"
  trusted_proxies: []
  storage_uri: "memory://"

security:
  enabled: false
  jwt_enabled: false
  api_token: ""
  https_redirect: false
  trusted_hosts: ["*"]
  headers:
    x_content_type_options: "nosniff"
    x_frame_options: "DENY"
    content_security_policy: "default-src 'self'"
    strict_transport_security: "max-age=63072000; includeSubDomains"

crawler:
  base_config:
    simulate_user: false
    check_robots_txt: true
  memory_threshold_percent: 85.0
  rate_limiter:
    enabled: true
    base_delay: [0.25, 0.75]
  timeouts:
    stream_init: 30.0
    batch_process: 180.0
  pool:
    max_pages: 12
    idle_ttl_sec: 180
  browser:
    kwargs:
      headless: true
      text_mode: true
      light_mode: true
    extra_args:
      - "--no-sandbox"
      - "--disable-dev-shm-usage"
      - "--disable-gpu"
      - "--disable-software-rasterizer"
      - "--disable-background-networking"
      - "--disable-remote-fonts"
      - "--disable-images"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

observability:
  prometheus:
    enabled: true
    endpoint: "/metrics"
  health_check:
    endpoint: "/health"

webhooks:
  enabled: false
  default_url: null
  data_in_payload: false
  retry:
    max_attempts: 3
    initial_delay_ms: 1000
    max_delay_ms: 8000
    timeout_ms: 10000
  headers:
    User-Agent: "Sirathic-Crawl4AI/1.0"

