name: sirathic-firecrawl

x-firecrawl-environment: &firecrawl-environment
  REDIS_URL: redis://redis:6379
  REDIS_RATE_LIMIT_URL: redis://redis:6379
  PLAYWRIGHT_MICROSERVICE_URL: http://playwright:3000/scrape
  POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:-firecrawl-local}
  POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB:-postgres}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
  USE_DB_AUTHENTICATION: "false"
  NUM_WORKERS_PER_QUEUE: ${FIRECRAWL_WORKERS:-2}
  CRAWL_CONCURRENT_REQUESTS: ${FIRECRAWL_CONCURRENCY:-2}
  MAX_CONCURRENT_JOBS: ${FIRECRAWL_CONCURRENCY:-2}
  BROWSER_POOL_SIZE: ${FIRECRAWL_CONCURRENCY:-2}
  BULL_AUTH_KEY: ${FIRECRAWL_ADMIN_KEY:-development-only-change-me}
  SEARXNG_ENDPOINT: ${FIRECRAWL_SEARXNG_ENDPOINT:-}
  LOGGING_LEVEL: ${FIRECRAWL_LOGGING_LEVEL:-info}
  ENV: local

services:
  api:
    image: sirathic/firecrawl:local
    build:
      context: ../..
      dockerfile: infra/firecrawl/Dockerfile
    environment:
      <<: *firecrawl-environment
      HOST: 0.0.0.0
      PORT: 3002
      EXTRACT_WORKER_PORT: 3004
      WORKER_PORT: 3005
      HARNESS_STARTUP_TIMEOUT_MS: ${FIRECRAWL_STARTUP_TIMEOUT_MS:-120000}
    depends_on:
      playwright:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "3002:3002"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped

  playwright:
    image: sirathic/firecrawl-playwright:local
    build:
      context: ../..
      dockerfile: infra/firecrawl/Dockerfile.playwright
    environment:
      PORT: 3000
      PROXY_SERVER: ${FIRECRAWL_PROXY_SERVER:-}
      PROXY_USERNAME: ${FIRECRAWL_PROXY_USERNAME:-}
      PROXY_PASSWORD: ${FIRECRAWL_PROXY_PASSWORD:-}
      BLOCK_MEDIA: ${FIRECRAWL_BLOCK_MEDIA:-true}
      MAX_CONCURRENT_PAGES: ${FIRECRAWL_CONCURRENCY:-2}
    shm_size: 1gb
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    restart: unless-stopped

  redis:
    image: redis@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command: ["redis-server", "--bind", "0.0.0.0", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: ghcr.io/firecrawl/nuq-postgres@sha256:aed86f62858f29bd971abddcdeb301c12888098d2cf5d33c1ba42b053bc460f6
    environment:
      POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:-firecrawl-local}
      POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
